
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackearam meu site </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #1e40af;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0002;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #1e40af;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Primeiro Site</h1>
        <p>Bem-vindo ao meu site!</p>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>

    <main>
        <section class="card" id="inicio">
            <h2>Olá, mundo!</h2>
            <p>Este é meu primeiro site criado com HTML e CSS.</p>

            <button onclick="mostrarMensagem()">
                Clique aqui
            </button>

            <p id="mensagem"></p>
        </section>

        <section id="sobre" style="margin-top:40px">
            <h2>Sobre nós</h2>
            <p>Este espaço pode apresentar você ou seu projeto.</p>
        </section>

        <section id="contato" style="margin-top:40px">
            <h2>Contato</h2>
            <p>Email: contato@meusite.com</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Meu Site - Todos os direitos reservados.</p>
    </footer>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerText =
                "Obrigado por visitar meu site!";
        }
    </script>

</body>
</html>
